# VoiceTerm hub in Docker.
#   cp deploy/env.example .env   # edit, then:
#   docker compose -f deploy/docker-compose.yml up -d --build
#
# network_mode: host is recommended on Linux: the hub connects to cc-connect on
# 127.0.0.1:9810, which is unreachable from a bridged container.
services:
  hub:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: voiceterm-hub:1.0.1
    container_name: voiceterm-hub
    restart: unless-stopped
    network_mode: host
    env_file:
      - ../.env
    volumes:
      - ${HOME}/.config/voice-hub:/home/node/.config/voice-hub:ro
      - ${HOME}/.config/voice-gateway:/home/node/.config/voice-gateway:ro
